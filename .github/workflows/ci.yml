name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    if: github.event.action != 'edited'
    permissions:
      contents: read
      id-token: write
    uses: NeuralTrust/workflows/.github/workflows/tests.yml@9126164828e7cb2f6da91d8f87f54b663d323324
    with:
      language: python
      language_version: "3.12"
      test_enabled: false
      uv_sync_args: --locked --all-groups
      lint_command: |
        uv run --locked ruff check .
        uv run --locked ruff format --check .
        uv run --locked mypy

  tests:
    if: github.event.action != 'edited'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        language_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    uses: NeuralTrust/workflows/.github/workflows/tests.yml@9126164828e7cb2f6da91d8f87f54b663d323324
    with:
      language: python
      language_version: ${{ matrix.language_version }}
      lint_enabled: false
      uv_sync_args: --locked --all-groups
      test_command: |
        uv run --locked pytest -q
        OTEL_SEMCONV_STABILITY_OPT_IN='gen_ai_unredacted_attributes=' uv run --locked python examples/offline.py

  package:
    if: github.event.action != 'edited'
    permissions:
      contents: read
      id-token: write
    uses: NeuralTrust/workflows/.github/workflows/tests.yml@9126164828e7cb2f6da91d8f87f54b663d323324
    with:
      language: python
      language_version: "3.12"
      lint_enabled: false
      uv_sync_args: --locked --all-groups
      test_command: |
        uv build
        uv run --locked twine check --strict dist/*

  sdk_compatibility:
    name: SDK ${{ matrix.sdk.name }} / Python ${{ matrix.language_version }}
    if: github.event.action != 'edited'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        language_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        sdk:
          - name: minimum
            requirement: strands-agents==1.54.0
          - name: latest
            requirement: strands-agents>=1.54.0,<2.0.0
    uses: NeuralTrust/workflows/.github/workflows/tests.yml@9126164828e7cb2f6da91d8f87f54b663d323324
    with:
      language: python
      language_version: ${{ matrix.language_version }}
      lint_enabled: false
      uv_sync_args: --locked --all-groups
      test_command: |
        compat_root=$(mktemp -d "${RUNNER_TEMP:-/tmp}/sdk-compat.XXXXXX")
        uv build --wheel --out-dir "$compat_root/dist"
        uv venv --python '${{ matrix.language_version }}' "$compat_root/venv"
        compat_python="$compat_root/venv/bin/python"
        # Resolve afresh in an isolated environment; uv run would restore the lockfile.
        uv pip install --python "$compat_python" --upgrade --strict \
          --group dev "$compat_root"/dist/*.whl '${{ matrix.sdk.requirement }}'
        uv pip check --python "$compat_python"
        "$compat_python" -I - <<'PY'
        import sys
        from importlib.metadata import version
        from pathlib import Path

        import strands_neuraltrust

        installed_path = Path(strands_neuraltrust.__file__).resolve()
        assert installed_path.is_relative_to(Path(sys.prefix).resolve()), installed_path
        print(f"strands-neuraltrust {version('strands-neuraltrust')} from {installed_path}")
        print(f"strands-agents {version('strands-agents')}")
        PY
        "$compat_python" -I -m pytest -q
        OTEL_SEMCONV_STABILITY_OPT_IN='gen_ai_unredacted_attributes=' "$compat_python" -I examples/offline.py

  security:
    if: github.event.action != 'edited'
    uses: NeuralTrust/workflows/.github/workflows/sast.yml@9126164828e7cb2f6da91d8f87f54b663d323324
    with:
      bandit_enabled: true
      bandit_path: src/strands_neuraltrust
      pip_audit_enabled: true
      trivy_pr_comment: false

  pr_metadata_validation:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: NeuralTrust/workflows/.github/workflows/pr-metadata.yml@9126164828e7cb2f6da91d8f87f54b663d323324
